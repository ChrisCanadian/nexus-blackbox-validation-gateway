[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-blackbox-validation-gateway"
version = "0.1.0"
description = "Public-safe black-box validation gateway for opaque AI runtime targets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.120,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
